[project]
name = "homedesign-backend"
version = "0.1.0"
description = "Home Design Platform backend: semantic building model, validation, and canonical serialization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homedesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.10 prefers httpx2 for its TestClient; httpx 0.28 (approved in API-001 §11, item 1) works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
