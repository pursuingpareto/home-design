[project]
name = "homedesign-backend"
version = "0.1.0"
description = "Home Design Platform backend: semantic building model, validation, and canonical serialization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homedesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
